- id: q-particle-model-01
  conceptId: sci-y7-particle-model
  prompt: In a gas, the particles are...
  type: multiple-choice
  options:
    - touching each other tightly
    - far apart with empty space between them
    - arranged in a fixed pattern
  correctAnswer: far apart with empty space between them
  difficulty: 0.3
  hint: Think about why a gas can spread out to completely fill any container you put it in.
  explanation: Gas particles have lots of space between them and move freely, which is why gases spread out to fill their container.
- id: q-particle-model-02
  conceptId: sci-y7-particle-model
  prompt: Do particles in a solid stop moving completely? Explain.
  type: short-answer
  correctAnswer: "No — they vibrate in place around a fixed position."
  difficulty: 0.5
  hint: A solid holds its shape, but that doesn't mean nothing is happening at the particle level.
  explanation: Particles are always moving, even in a solid — in a solid they vibrate around a fixed spot rather than moving freely.
- id: q-particle-model-03
  conceptId: sci-y7-particle-model
  prompt: Which best describes how particles are arranged in a liquid?
  type: multiple-choice
  options:
    - Packed tightly in a fixed pattern that never changes
    - Close together but able to slide past each other
    - Spread far apart with lots of empty space between them
  correctAnswer: Close together but able to slide past each other
  difficulty: 0.4
  hint: Think about why you can pour a liquid but it still keeps roughly the same volume.
  explanation: Liquid particles stay close together, like in a solid, but they can slide past one another — that's what lets a liquid flow and take the shape of its container.
- id: q-particle-model-04
  conceptId: sci-y7-particle-model
  prompt: A solid, a liquid, and a gas made of the same substance all contain the same type of particles. What actually changes between the three states?
  type: short-answer
  correctAnswer: "How closely packed the particles are and how freely they can move — the particles themselves don't change."
  difficulty: 0.6
  hint: Ice, water, and steam are all still water — so what's different isn't the particles themselves.
  explanation: Melting or boiling a substance doesn't change what its particles are — it changes how tightly packed they are and how much freedom they have to move around.
- id: q-particle-model-05
  conceptId: sci-y7-particle-model
  prompt: Heating a substance makes its particles move faster.
  type: multiple-choice
  options:
    - "True"
    - "False"
  correctAnswer: "True"
  difficulty: 0.3
  hint: Think about what energy from heat actually does to something at the particle level.
  explanation: Adding heat gives particles more energy, so they move (or vibrate) faster — this is also why substances can change state when heated.
- id: q-particle-model-06
  conceptId: sci-y7-particle-model
  prompt: Why can a gas be squeezed into a much smaller container far more easily than a liquid can?
  type: multiple-choice
  options:
    - Gas particles have lots of empty space between them that can be squeezed out
    - Gas particles are smaller in size than liquid particles
    - Gas particles have less mass than liquid particles
  correctAnswer: Gas particles have lots of empty space between them that can be squeezed out
  difficulty: 0.4
  hint: Think about how far apart gas particles are compared to liquid particles — what's mostly in that space?
  explanation: Gas particles are spread far apart with lots of empty space between them, so pushing them closer together just squeezes out that empty space. Liquid particles are already close together, so there's much less room to compress.
- id: q-particle-model-07
  conceptId: sci-y7-particle-model
  prompt: How are particles arranged in a solid?
  type: short-answer
  correctAnswer: "Tightly packed together in a fixed, regular pattern."
  difficulty: 0.3
  hint: Think about why a solid keeps its own shape instead of flowing or spreading out.
  explanation: In a solid, particles are packed closely together in a fixed, regular arrangement, which is why a solid holds its shape — even though the particles themselves are still vibrating in place.
