- id: q-matter-01
  conceptId: sci-y7-matter
  prompt: Which of these best defines matter?
  type: multiple-choice
  options:
    - Anything that has mass and takes up space
    - Anything that is solid
    - Anything you can see
  correctAnswer: Anything that has mass and takes up space
  difficulty: 0.2
  hint: Think about the two properties every physical thing shares, no matter what state it's in.
  explanation: Matter is defined by having mass and taking up space — not by its state or whether it's visible.
- id: q-matter-02
  conceptId: sci-y7-matter
  prompt: Is the air in a balloon matter? Explain why.
  type: short-answer
  correctAnswer: "Yes — air has mass and takes up space, even though it can't be seen."
  difficulty: 0.4
  hint: Think about what happens to a balloon when you blow air into it — did something with mass get added?
  explanation: Gases are matter too — you can't always see them, but they still have mass and take up space (that's why a balloon inflates).
- id: q-matter-03
  conceptId: sci-y7-matter
  prompt: Which of these is NOT one of the three common states of matter?
  type: multiple-choice
  options:
    - Solid
    - Liquid
    - Energy
    - Gas
  correctAnswer: Energy
  difficulty: 0.2
  hint: Three of these describe how particles are packed together and moving; one of them is what causes those to change instead.
  explanation: Energy isn't a state of matter — it's what causes matter to change between solid, liquid, and gas.
- id: q-matter-04
  conceptId: sci-y7-matter
  prompt: Name one example of matter from your everyday life.
  type: short-answer
  correctAnswer: "Any real object or substance with mass, e.g. water, a book, air."
  difficulty: 0.3
  hint: Look around you — anything you could weigh, or that takes up space in the room, counts.
  explanation: Almost everything around you is matter — if it has mass and takes up space, it counts.
- id: q-matter-05
  conceptId: sci-y7-matter
  prompt: A rock and a puddle of water are both examples of matter.
  type: multiple-choice
  options:
    - "True"
    - "False"
  correctAnswer: "True"
  difficulty: 0.1
  hint: Ask yourself — do both of these have mass, and do both take up space?
  explanation: Both a solid rock and a liquid puddle have mass and take up space, so both are matter, even though one is solid and one is liquid.
- id: q-matter-06
  conceptId: sci-y7-matter
  prompt: Which of these things is matter?
  type: multiple-choice
  options:
    - A shadow on the wall
    - The sound of a bell
    - A cloud of steam
    - An idea in your head
  correctAnswer: A cloud of steam
  difficulty: 0.3
  hint: A shadow, a sound, and an idea don't have mass or take up space of their own — which option does?
  explanation: A cloud of steam is made of tiny water particles, so it has mass and takes up space, just like any gas. Shadows, sounds, and ideas aren't matter — they don't have mass or occupy space themselves.
- id: q-matter-07
  conceptId: sci-y7-matter
  prompt: Name the three common states of matter.
  type: short-answer
  correctAnswer: "Solid, liquid, and gas."
  difficulty: 0.2
  hint: Think of ice, water, and steam — each one is a different one of these.
  explanation: The three common states of matter are solid, liquid, and gas. The same substance can exist as any of them depending on how much energy its particles have.
