    questionId: q-body-systems-01
  - type: question
    questionId: q-body-systems-02
  - type: question
    questionId: q-body-systems-03
  - type: question
    questionId: q-body-systems-04
  - type: question
    questionId: q-body-systems-05
  - type: summary
    body: >
      An organ system is a group of organs working together to do a major
      job, and this lesson covered the digestive, circulatory, and
      respiratory systems. Organ systems constantly cooperate — for example,
      the respiratory and circulatory systems work together to deliver
      oxygen to every cell. Breathing is the physical movement of air, while
      respiration is the chemical process inside cells that uses that
      oxygen to release energy.
