id: lesson-particle-model-intro
conceptId: sci-y7-particle-model
title: Introducing the Particle Model
summary: A first look at how particles explain the behaviour of matter.
steps:
  - type: explanation
    body: >
      Everything around you is made of particles too small to see. This
      lesson introduces the particle model and how it explains why solids
      hold their shape, liquids flow, and gases spread out to fill their
      container. The particles themselves don't change between states —
      what changes is how closely packed they are and how freely they can
      move.
  - type: example
    body: >
      A block of ice, a puddle of water, and steam are all the same
      substance — only the arrangement and motion of its particles differ.
      In the ice, particles are locked close together and just vibrate in
      place. In the water, they're still close but can slide past each
      other. In the steam, they're spread far apart and zoom around
      freely.
  - type: interactive
    widget: particle-state-explorer
    prompt: >
      Tap Solid, Liquid, and Gas below and watch how the particles are
      packed and how they move in each state.
  - type: question
    questionId: q-particle-model-01
  - type: question
    questionId: q-particle-model-02
  - type: question
    questionId: q-particle-model-03
  - type: question
    questionId: q-particle-model-04
  - type: question
    questionId: q-particle-model-05
  - type: summary
    body: >
      Solids, liquids, and gases are all made of the same kind of particles;
      what differs is how closely packed and how freely those particles move.
      Heating a substance gives its particles more energy, making them move
      faster — which is why substances change state when they're heated or
      cooled.
